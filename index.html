<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knothnwhimsy by hamra</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff9fb;
            color: #444;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #ff85a2 0%, #ff6f91 100%);
            padding: 40px 20px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 111, 145, 0.3);
        }
        header h1 { margin: 0; font-size: 3em; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        header p { font-size: 1.2em; opacity: 0.9; margin-top: 10px; }

        .container { padding: 40px 20px; max-width: 1200px; margin: auto; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #ffe4e9;
            text-align: center;
            transition: 0.3s ease;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(255, 111, 145, 0.2); }

        .product-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            background-color: #fdf2f4;
        }

        .product-card h3 { color: #d81b60; font-size: 1.5em; margin: 15px 0 5px 0; }
        .price { font-size: 1.4em; font-weight: 600; color: #ff6f91; margin-bottom: 20px; display: block; }
        
        .buy-btn {
            background: #d81b60;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 600;
            transition: 0.3s;
            width: 80%;
        }
        .buy-btn:hover { background: #ad1457; letter-spacing: 1px; }

        /* Form Overlay */
        #details-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #details-page {
            background: white;
            padding: 30px;
            border-radius: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        #details-page h2 { color: #d81b60; margin-top: 0; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: 600; color: #666; font-size: 0.9em; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            box-sizing: border-box;
            font-family: inherit;
        }
        input:focus { border-color: #ff6f91; outline: none; }
        .confirm-btn { background: #25d366; margin-top: 25px; width: 100%; }
        .cancel-link { display: block; text-align: center; margin-top: 15px; color: #888; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <h1>Knothnwhimsy</h1>
    <p>🧶 Premium Handmade Crochet Creations by Hamra 🧶</p>
</header>

<div class="container" id="home-page">
    <div class="product-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1603533400539-7bb396860010?q=80&w=600" alt="Cherry" class="product-image">
            <h3>Cherry Keychain 🍒</h3>
            <span class="price">₹199</span>
            <button class="buy-btn" onclick="openForm('Cherry Keychain', '199')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1615486511484-92e172cc4fe0?q=80&w=600" alt="Jellyfish" class="product-image">
            <h3>Jelly Fish Keychain 🪼</h3>
            <span class="price">₹249</span>
            <button class="buy-btn" onclick="openForm('Jelly Fish Keychain', '249')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?q=80&w=600" alt="Rose" class="product-image">
            <h3>Rose Keychain 🌹</h3>
            <span class="price">₹149</span>
            <button class="buy-btn" onclick="openForm('Rose Keychain', '149')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1494333165143-0d022bf682f6?q=80&w=600" alt="Bouquet" class="product-image">
            <h3>Flower Bouquet 💐</h3>
            <span class="price">₹899</span>
            <button class="buy-btn" onclick="openForm('Flower Bouquet', '899')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1624448660428-09dcad667303?q=80&w=600" alt="Cardigan" class="product-image">
            <h3>Handmade Cardigan 🧥</h3>
            <span class="price">₹1,999</span>
            <button class="buy-btn" onclick="openForm('Cardigan', '1999')">Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1520903920243-00d872a2d1c9?q=80&w=600" alt="Beanie" class="product-image">
            <h3>Cozy Beanie 🧢</h3>
            <span class="price">₹499</span>
            <button class="buy-btn" onclick="openForm('Beanie', '499')">Buy Now</button>
        </div>
    </div>
</div>

<div id="details-overlay">
    <div id="details-page">
        <h2>Order Details</h2>
        <p id="order-summary" style="text-align: center; font-weight: 600; color: #ff6f91; background: #fff0f5; padding: 10px; border-radius: 10px;"></p>
        
        <label>Full Name *</label>
        <input type="text" id="cust-name" placeholder="Aapka Naam">

        <label>Full Address *</label>
        <input type="text" id="cust-address" placeholder="Ghar ka pata">

        <div style="display: flex; gap: 10px;">
            <div style="flex:1">
                <label>Pincode *</label>
                <input type="number" id="cust-pin" placeholder="123456">
            </div>
            <div style="flex:1">
                <label>District *</label>
                <input type="text" id="cust-dist" placeholder="Zila">
            </div>
        </div>

        <label>Contact Number *</label>
        <input type="tel" id="cust-phone" placeholder="WhatsApp Number">

        <label>Alternative Contact</label>
        <input type="tel" id="cust-alt" placeholder="Optional">

        <label>Email ID</label>
        <input type="email" id="cust-email" placeholder="example@mail.com">

        <button class="buy-btn confirm-btn" onclick="sendToWhatsApp()">Confirm Order via WhatsApp ✅</button>
        <span class="cancel-link" onclick="closeForm()">Go Back</span>
    </div>
</div>

<script>
    let selectedItem = "";
    let selectedPrice = "";

    function openForm(item, price) {
        selectedItem = item;
        selectedPrice = price;
        document.getElementById('order-summary').innerText = "Ordering: " + item + " (₹" + price + ")";
        document.getElementById('details-overlay').style.display = 'flex';
    }

    function closeForm() {
        document.getElementById('details-overlay').style.display = 'none';
    }

    function sendToWhatsApp() {
        const name = document.getElementById('cust-name').value;
        const addr = document.getElementById('cust-address').value;
        const pin = document.getElementById('cust-pin').value;
        const dist = document.getElementById('cust-dist').value;
        const phone = document.getElementById('cust-phone').value;
        const alt = document.getElementById('cust-alt').value;
        const email = document.getElementById('cust-email').value;

        if(!name || !addr || !pin || !dist || !phone) {
            alert("Please fill all required (*) fields!");
            return;
        }

        const message = `*KNOTHNWHIMSY ORDER*%0A%0A` +
                        `*Item:* ${selectedItem}%0A` +
                        `*Price:* ₹${selectedPrice}%0A` +
                        `--------------------------%0A` +
                        `*Name:* ${name}%0A` +
                        `*Address:* ${addr}%0A` +
                        `*District:* ${dist}%0A` +
                        `*Pincode:* ${pin}%0A` +
                        `*Phone:* ${phone}%0A` +
                        (alt ? `*Alt Contact:* ${alt}%0A` : "") +
                        (email ? `*Email:* ${email}%0A` : "");

        const waLink = `https://wa.me/919469126968?text=${message}`;
        window.open(waLink, '_blank');
    }
</script>

</body>
</html>
