<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knothnwhimsy by hamra</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff0f5;
            color: #4a4a4a;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #ffaddf;
            background-image: linear-gradient(315deg, #ffaddf 0%, #ff6f91 74%);
            padding: 30px 20px;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.2);
            color: white;
        }
        h1 { margin: 0; font-size: 2.5em; }
        .container { padding: 30px 20px; max-width: 1100px; margin: auto; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 2px solid #ffeef2;
            transition: 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); border-color: #ff6f91; }

        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
        }

        .product-card h3 { color: #d81b60; margin: 15px 0 5px 0; }
        .price { font-size: 1.3em; font-weight: 600; color: #ff6f91; margin-bottom: 15px; }
        
        button {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: 0.3s;
        }
        button:hover { background-color: #ff6f91; transform: scale(1.05); }

        #details-page {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 500px;
            margin: 40px auto;
            text-align: left;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }
        label { display: block; margin-top: 15px; font-weight: 600; color: #d81b60; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .btn-group { margin-top: 25px; text-align: center; display: flex; gap: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Knothnwhimsy by hamra</h1>
    <p>🧶 Handmade with Love 🧶</p>
</header>

<div class="container" id="home-page">
    <div class="product-grid">
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1622321523314-9988451845f0?q=80&w=500" alt="Cherry" class="product-image">
            <h3>Cherry Keychain 🍒</h3>
            <p class="price">₹199</p>
            <button onclick="showDetails('Cherry Keychain', '199')">Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1615486511484-92e172cc4fe0?q=80&w=500" alt="Jellyfish" class="product-image">
            <h3>Jelly Fish Keychain 🪼</h3>
            <p class="price">₹249</p>
            <button onclick="showDetails('Jelly Fish Keychain', '249')">Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1599403215758-c0b9ba950275?q=80&w=500" alt="Rose" class="product-image">
            <h3>Rose Keychain 🌹</h3>
            <p class="price">₹149</p>
            <button onclick="showDetails('Rose Keychain', '149')">Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500" alt="Bouquet" class="product-image">
            <h3>Flower Bouquet 💐</h3>
            <p class="price">₹899</p>
            <button onclick="showDetails('Flower Bouquet', '899')">Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?q=80&w=500" alt="Cardigan" class="product-image">
            <h3>Cardigan 🧥</h3>
            <p class="price">₹1,999</p>
            <button onclick="showDetails('Cardigan', '1999')">Buy Now</button>
        </div>
        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?q=80&w=500" alt="Beanie" class="product-image">
            <h3>Beanie 🧢</h3>
            <p class="price">₹499</p>
            <button onclick="showDetails('Beanie', '499')">Buy Now</button>
        </div>
    </div>
</div>

<div id="details-page">
    <h2>📝 Shipping Details</h2>
    <p id="selected-item" style="text-align: center; color: #ff6f91; font-weight: bold;"></p>
    <label>Name *</label><input type="text" id="name" required>
    <label>Address *</label><input type="text" id="address" required>
    <label>Pincode *</label><input type="number" id="pincode" required>
    <label>District *</label><input type="text" id="district" required>
    <label>Contact Number *</label><input type="tel" id="contact" required>
    <label>Alternative Contact</label><input type="tel" id="altContact">
    <label>Email ID</label><input type="email" id="email">
    <div class="btn-group">
        <button onclick="confirmOrder()" style="flex: 2;">Confirm Order ✅</button>
        <button onclick="location.reload()" style="background: #ccc; flex: 1;">Cancel</button>
    </div>
</div>

<script>
    let currentItem = ""; let currentPrice = "";
    function showDetails(item, price) {
        currentItem = item; currentPrice = price;
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        document.getElementById('selected-item').innerText = item + " - ₹" + price;
    }
    function confirmOrder() {
        const n = document.getElementById('name').value;
        const a = document.getElementById('address').value;
        const c = document.getElementById('contact').value;
        const p = document.getElementById('pincode').value;
        const d = document.getElementById('district').value;
        if(!n || !a || !c || !p) { alert("Please fill details!"); return; }
        const msg = `*New Order*%0A*Item:* ${currentItem}%0A*Price:* ₹${currentPrice}%0A*Name:* ${n}%0A*Address:* ${a}%0A*District:* ${d}%0A*Pincode:* ${p}%0A*Contact:* ${c}`;
        window.open(`https://wa.me/919469126968?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
